App\Entity\Location:
    properties:
        name:
            - NotBlank:
                  groups: [create, edit]
        country:
            - NotBlank:
                  groups: [create, edit]
        latitude:
            - Range:
                  min: -90
                  max: 90
                  groups: [create, edit]
        longitude:
            - Range:
                  min: -180
                  max: 180
                  groups: [create, edit]

App\Entity\Forecast:
    properties:
        location:
            - NotNull:
                  groups: [create, edit]
        date:
            - NotNull:
                  groups: [create, edit]
        temperature:
            - Range:
                  min: -100
                  max: 100
                  groups: [create, edit]
        precipitation:
            - PositiveOrZero:
                  groups: [create, edit]
        wind:
            - PositiveOrZero:
                  groups: [create, edit]
        humidity:
            - Range:
                  min: 0
                  max: 100
                  groups: [create, edit]
